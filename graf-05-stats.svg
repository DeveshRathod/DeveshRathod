<svg width="820" height="210" viewBox="0 0 820 210" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><clipPath id="g5"><rect width="820" height="210" rx="8"/></clipPath></defs>
  <g clip-path="url(#g5)">
    <rect width="820" height="210" fill="#111217"/>
    <rect width="820" height="34" fill="#181b1f"/>
    <rect x="0" y="0" width="3" height="34" fill="#3274d9"/>
    <text x="20" y="22" font-size="12.5" font-weight="600" fill="#e6edf3">GitHub Activity</text>
    <text x="800" y="22" text-anchor="end" font-size="10.5" fill="#8e9ab0" font-family="ui-monospace, monospace">Jul 2022 → now</text>

    <!-- stat 1: total contributions -->
    <g transform="translate(150,120)" text-anchor="middle">
      <text y="0" font-size="40" font-weight="800" fill="#3274d9">386</text>
      <text y="26" font-size="12" fill="#8e9ab0" font-family="ui-monospace, monospace">total contributions</text>
    </g>

    <!-- stat 2: longest streak -->
    <g transform="translate(400,120)" text-anchor="middle">
      <text y="0" font-size="40" font-weight="800" fill="#f5a623">8</text>
      <text y="26" font-size="12" fill="#8e9ab0" font-family="ui-monospace, monospace">longest streak (days)</text>
    </g>

    <!-- stat 3: current streak -->
    <g transform="translate(650,120)" text-anchor="middle">
      <text y="0" font-size="40" font-weight="800" fill="#c7d0dd">0</text>
      <text y="26" font-size="12" fill="#8e9ab0" font-family="ui-monospace, monospace">current streak</text>
    </g>

    <line x1="275" y1="70" x2="275" y2="150" stroke="#23282e"/>
    <line x1="525" y1="70" x2="525" y2="150" stroke="#23282e"/>

    <text x="20" y="196" font-size="10.5" fill="#5a6472" font-family="ui-monospace, monospace">live repository count and language breakdown: github.com/DeveshRathod?tab=repositories</text>
  </g>
