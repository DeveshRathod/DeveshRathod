<svg width="820" height="205" viewBox="0 0 820 205" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="g1"><rect width="820" height="205" rx="8"/></clipPath>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F46800"/><stop offset="1" stop-color="#e0529c"/></linearGradient>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a4149"/></marker>
    <filter id="stageGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#g1)">
    <rect width="820" height="205" fill="#111217"/>
    <rect width="820" height="42" fill="#181b1f"/>
    <rect x="0" y="0" width="4" height="42" fill="url(#hdr)"/>
    <text x="20" y="21" font-size="15" font-weight="700" fill="#e6edf3">Devesh Rathod</text>
    <text x="20" y="35" font-size="11" fill="#8e9ab0" font-family="ui-monospace, monospace">DevOps &amp; Cloud Engineer · AWS · GCP · Kubernetes</text>

    <!-- intro, left column -->
    <g opacity="0">
      <animate attributeName="opacity" begin="0.3s" dur="0.5s" fill="freeze" values="0;1"/>
      <text x="20" y="80" font-size="17" font-weight="700" fill="#e6edf3">I build cloud</text>
      <text x="20" y="103" font-size="17" font-weight="700" fill="#e6edf3">infrastructure that</text>
      <text x="20" y="126" font-size="17" font-weight="700" fill="#e6edf3">ships itself.</text>
      <text x="20" y="150" font-size="12" fill="#c7d0dd">Multi-cloud on <tspan fill="#5b9dff" font-weight="600">AWS</tspan> + <tspan fill="#5b9dff" font-weight="600">GCP</tspan></text>
      <text x="20" y="168" font-size="12" fill="#c7d0dd"><tspan fill="#73bf69" font-weight="600">Kubernetes</tspan> · <tspan fill="#73bf69" font-weight="600">GitOps</tspan> · <tspan fill="#73bf69" font-weight="600">IaC</tspan></text>
    </g>

    <!-- divider, much closer to the text now -->
    <line x1="250" y1="58" x2="250" y2="176" stroke="#1e2630" stroke-width="1"/>

    <!-- pipeline panel — wider, starts right after the divider -->
    <rect x="270" y="58" width="530" height="118" rx="8" fill="#161b22" stroke="#23282e"/>

    <g>
      <circle cx="286" cy="76" r="4" fill="#73bf69"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="296" y="80" font-size="10.5" fill="#73bf69" font-family="ui-monospace, monospace" font-weight="700">deploy-pipeline</text>
    </g>
    <text x="786" y="80" text-anchor="end" font-size="9.5" fill="#5a6472" font-family="ui-monospace, monospace">passing</text>
    <line x1="282" y1="88" x2="788" y2="88" stroke="#1e2630" stroke-width="1"/>

    <!-- signal rail above the boxes -->
    <line x1="334" y1="92" x2="706" y2="92" stroke="#232a33" stroke-width="1.4"/>
    <line x1="334" y1="92" x2="334" y2="100" stroke="#2b3540" stroke-width="1.2"/>
    <line x1="458" y1="92" x2="458" y2="100" stroke="#2b3540" stroke-width="1.2"/>
    <line x1="582" y1="92" x2="582" y2="100" stroke="#2b3540" stroke-width="1.2"/>
    <line x1="706" y1="92" x2="706" y2="100" stroke="#2b3540" stroke-width="1.2"/>

    <!-- connectors between stages -->
    <g stroke="#3a4149" stroke-width="1.4" fill="none">
      <line x1="384" y1="120" x2="408" y2="120" marker-end="url(#arw)"/>
      <line x1="508" y1="120" x2="532" y2="120" marker-end="url(#arw)"/>
      <line x1="632" y1="120" x2="656" y2="120" marker-end="url(#arw)"/>
    </g>

    <!-- stage boxes -->
    <g font-family="ui-monospace, monospace" font-size="10" text-anchor="middle" font-weight="700">
      <g>
        <rect x="284" y="100" width="100" height="40" rx="6" fill="#0e1116" stroke="#3a4149" stroke-width="1.4" filter="url(#stageGlow)">
          <animate attributeName="stroke" begin="0s" dur="4s" repeatCount="indefinite" keyTimes="0;0.05;0.18;1" values="#73bf69;#73bf69;#3a4149;#3a4149"/>
        </rect>
        <text x="334" y="123" fill="#e6edf3" font-size="12">BUILD</text>
      </g>
      <g>
        <rect x="408" y="100" width="100" height="40" rx="6" fill="#0e1116" stroke="#3a4149" stroke-width="1.4" filter="url(#stageGlow)">
          <animate attributeName="stroke" begin="0s" dur="4s" repeatCount="indefinite" keyTimes="0;0.28;0.33;0.46;1" values="#3a4149;#3a4149;#73bf69;#3a4149;#3a4149"/>
        </rect>
        <text x="458" y="123" fill="#e6edf3" font-size="12">TEST</text>
      </g>
      <g>
        <rect x="532" y="100" width="100" height="40" rx="6" fill="#0e1116" stroke="#3a4149" stroke-width="1.4" filter="url(#stageGlow)">
          <animate attributeName="stroke" begin="0s" dur="4s" repeatCount="indefinite" keyTimes="0;0.61;0.66;0.79;1" values="#3a4149;#3a4149;#73bf69;#3a4149;#3a4149"/>
        </rect>
        <text x="582" y="123" fill="#e6edf3" font-size="12">DEPLOY</text>
      </g>
      <g>
        <rect x="656" y="100" width="100" height="40" rx="6" fill="#0e1116" stroke="#5b9dff" stroke-width="1.4" filter="url(#stageGlow)">
          <animate attributeName="stroke" begin="0s" dur="4s" repeatCount="indefinite" keyTimes="0;0.94;0.98;1" values="#5b9dff;#5b9dff;#73bf69;#5b9dff"/>
        </rect>
        <text x="706" y="123" fill="#e6edf3" font-size="12">PROD</text>
      </g>
    </g>

    <!-- traveling pulse -->
    <circle r="3" fill="#73bf69" filter="url(#stageGlow)">
      <animateMotion dur="4s" repeatCount="indefinite" path="M334,92 L458,92 L582,92 L706,92"/>
    </circle>

    <text x="284" y="164" font-size="9" fill="#4a5563" font-family="ui-monospace, monospace">every commit ships itself, dev &#8594; staging &#8594; prod</text>

    <text x="20" y="194" font-size="10.5" fill="#5a6472" font-family="ui-monospace, monospace">Software Engineer @ LTM · Dec 2024 → now · Pune, India</text>
  </g>
</svg>
