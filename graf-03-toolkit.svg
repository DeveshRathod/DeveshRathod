      <text x="20" y="72" font-size="11.5" fill="#8e9ab0">Cloud</text>
      <g transform="translate(140,60)" font-size="11.5" fill="#c7d0dd">
        <g><rect width="58" height="24" rx="5" fill="#181b1f" stroke="#3d7a3d"/><text x="29" y="16" text-anchor="middle">AWS</text></g>
        <g transform="translate(66,0)"><rect width="58" height="24" rx="5" fill="#181b1f" stroke="#3d7a3d"/><text x="29" y="16" text-anchor="middle">GCP</text></g>
      </g>

      <!-- row 2: containers -->
      <text x="20" y="106" font-size="11.5" fill="#8e9ab0">Containers</text>
      <g transform="translate(140,94)" font-size="11.5" fill="#c7d0dd">
        <g><rect width="74" height="24" rx="5" fill="#181b1f" stroke="#3266a8"/><text x="37" y="16" text-anchor="middle">Docker</text></g>
        <g transform="translate(82,0)"><rect width="98" height="24" rx="5" fill="#181b1f" stroke="#3266a8"/><text x="49" y="16" text-anchor="middle">Kubernetes</text></g>
        <g transform="translate(188,0)"><rect width="86" height="24" rx="5" fill="#181b1f" stroke="#3266a8"/><text x="43" y="16" text-anchor="middle">Kustomize</text></g>
      </g>

