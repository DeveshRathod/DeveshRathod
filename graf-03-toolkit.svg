<svg width="820" height="248" viewBox="0 0 820 248" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><clipPath id="g3"><rect width="820" height="248" rx="8"/></clipPath></defs>
  <g clip-path="url(#g3)">
    <rect width="820" height="248" fill="#111217"/>
    <rect width="820" height="34" fill="#181b1f"/>
    <rect x="0" y="0" width="3" height="34" fill="#F46800"/>
    <text x="20" y="22" font-size="12.5" font-weight="600" fill="#e6edf3">Toolkit</text>
    <text x="800" y="22" text-anchor="end" font-size="10.5" fill="#8e9ab0" font-family="ui-monospace, monospace">6 categories</text>

    <!-- each row: label at x=20 (baseline aligned to chip center), chips start at x=140 -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">

