<svg width="820" height="420" viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><clipPath id="g2"><rect width="820" height="420" rx="8"/></clipPath></defs>
  <g clip-path="url(#g2)">
    <rect width="820" height="420" fill="#111217"/>
    <rect width="820" height="34" fill="#181b1f"/>
    <rect x="0" y="0" width="3" height="34" fill="#F46800"/>
    <text x="20" y="22" font-size="12.5" font-weight="600" fill="#e6edf3">Projects</text>
    <text x="800" y="22" text-anchor="end" font-size="10.5" fill="#73bf69" font-family="ui-monospace, monospace">6 / 6 healthy</text>

    <!-- ============ CARD 1: Zero-Trust Service Mesh ============ -->
    <g transform="translate(16,50)">
      <rect width="254" height="170" rx="6" fill="#181b1f" stroke="#23282e"/>
      <rect width="4" height="170" rx="2" fill="#73bf69"/>
      <circle cx="230" cy="18" r="4" fill="#73bf69"><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="16" y="24" font-size="12.5" font-weight="700" fill="#e6edf3">Zero-Trust Service Mesh</text>
      <text x="16" y="42" font-size="9.5" fill="#8e9ab0" font-family="ui-monospace, monospace">Istio Ambient · Kubernetes · ArgoCD</text>
      <text x="16" y="66" font-size="10.5" fill="#c7d0dd">Proving a rogue pod gets</text>
      <text x="16" y="82" font-size="10.5" fill="#c7d0dd">denied — not just encrypted.</text>
      <rect x="16" y="134" width="185" height="24" rx="5" fill="#0f2419"/>
      <text x="108" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#73bf69" font-family="ui-monospace, monospace">2/2 attack paths denied</text>
    </g>

    <!-- ============ CARD 2: Serverless Code Judge ============ -->
    <g transform="translate(282,50)">
      <rect width="254" height="170" rx="6" fill="#181b1f" stroke="#23282e"/>
      <rect width="4" height="170" rx="2" fill="#3274d9"/>
      <circle cx="230" cy="18" r="4" fill="#73bf69"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite"/></circle>
      <text x="16" y="24" font-size="12.5" font-weight="700" fill="#e6edf3">Serverless Code Judge</text>
      <text x="16" y="42" font-size="9.5" fill="#8e9ab0" font-family="ui-monospace, monospace">AWS Lambda · FastAPI · MySQL</text>
      <text x="16" y="66" font-size="10.5" fill="#c7d0dd">Built the "LeetCode for bash"</text>
      <text x="16" y="82" font-size="10.5" fill="#c7d0dd">I couldn't find anywhere.</text>
      <rect x="16" y="134" width="185" height="24" rx="5" fill="#0d1b2e"/>
      <text x="108" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b9dff" font-family="ui-monospace, monospace">99 &#8594; 500 concurrent</text>
    </g>

    <!-- ============ CARD 3: GitOps on EKS ============ -->
    <g transform="translate(548,50)">
      <rect width="254" height="170" rx="6" fill="#181b1f" stroke="#23282e"/>
      <rect width="4" height="170" rx="2" fill="#f5a623"/>
      <circle cx="230" cy="18" r="4" fill="#73bf69"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <text x="16" y="24" font-size="12.5" font-weight="700" fill="#e6edf3">GitOps on EKS</text>
      <text x="16" y="42" font-size="9.5" fill="#8e9ab0" font-family="ui-monospace, monospace">ArgoCD · Jenkins · Prometheus</text>
      <text x="16" y="66" font-size="10.5" fill="#c7d0dd">Jenkins for CI, ArgoCD for CD —</text>
      <text x="16" y="82" font-size="10.5" fill="#c7d0dd">each doing what it's good at.</text>
      <rect x="16" y="134" width="185" height="24" rx="5" fill="#3a2a12"/>
      <text x="108" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f5a623" font-family="ui-monospace, monospace">-40% deploy time</text>
    </g>

    <!-- ============ CARD 4: Real-Time Chat + Video ============ -->
    <g transform="translate(16,234)">
      <rect width="254" height="170" rx="6" fill="#181b1f" stroke="#23282e"/>
      <rect width="4" height="170" rx="2" fill="#e0529c"/>
      <circle cx="230" cy="18" r="4" fill="#73bf69"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/></circle>
      <text x="16" y="24" font-size="12.5" font-weight="700" fill="#e6edf3">Real-Time Chat + Video</text>
      <text x="16" y="42" font-size="9.5" fill="#8e9ab0" font-family="ui-monospace, monospace">Lambda · Chime SDK · DynamoDB</text>
      <text x="16" y="66" font-size="10.5" fill="#c7d0dd">Split into two Lambdas to</text>
      <text x="16" y="82" font-size="10.5" fill="#c7d0dd">escape a VPC dead-end.</text>
      <rect x="16" y="134" width="185" height="24" rx="5" fill="#3a1a2a"/>
      <text x="108" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f28cc0" font-family="ui-monospace, monospace">$0 NAT Gateway needed</text>
    </g>

    <!-- ============ CARD 5: Serverless SaaS Platform (Calma) ============ -->
    <g transform="translate(282,234)">
      <rect width="254" height="170" rx="6" fill="#181b1f" stroke="#23282e"/>
      <rect width="4" height="170" rx="2" fill="#2dd4bf"/>
      <circle cx="230" cy="18" r="4" fill="#73bf69"><animate attributeName="opacity" values="1;0.4;1" dur="1.9s" repeatCount="indefinite"/></circle>
      <text x="16" y="24" font-size="12.5" font-weight="700" fill="#e6edf3">Serverless SaaS Platform</text>
      <text x="16" y="42" font-size="9.5" fill="#8e9ab0" font-family="ui-monospace, monospace">Lambda · Terraform · CloudFront</text>
      <text x="16" y="66" font-size="10.5" fill="#c7d0dd">What would a startup actually</text>
      <text x="16" y="82" font-size="10.5" fill="#c7d0dd">use to keep costs low?</text>
      <rect x="16" y="134" width="185" height="24" rx="5" fill="#0f2b28"/>
      <text x="108" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2dd4bf" font-family="ui-monospace, monospace">$0 idle cost</text>
    </g>

    <!-- ============ CARD 6: Multi-Cloud IaC Platform ============ -->
    <g transform="translate(548,234)">
      <rect width="254" height="170" rx="6" fill="#181b1f" stroke="#23282e"/>
      <rect width="4" height="170" rx="2" fill="#b980e0"/>
      <circle cx="230" cy="18" r="4" fill="#73bf69"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="16" y="24" font-size="12.5" font-weight="700" fill="#e6edf3">Multi-Cloud IaC Platform</text>
      <text x="16" y="42" font-size="9.5" fill="#8e9ab0" font-family="ui-monospace, monospace">Terraform · AWS + GCP</text>
      <text x="16" y="66" font-size="10.5" fill="#c7d0dd">Two clouds, zero shared trust,</text>
      <text x="16" y="82" font-size="10.5" fill="#c7d0dd">one Terraform apply.</text>
      <rect x="16" y="134" width="185" height="24" rx="5" fill="#2a1a3a"/>
      <text x="108" y="150" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c088e8" font-family="ui-monospace, monospace">0 public DB exposure</text>
    </g>

  </g>
</svg>
